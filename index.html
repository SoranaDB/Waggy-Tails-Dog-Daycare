<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174d3b">
<title>Waggy Tails Dog Daycare — Internal Alpha</title>
<style>
:root{--ink:#20332c;--muted:#64766e;--green:#174d3b;--green2:#237354;--mint:#e8f5ed;--cream:#fbf8f0;--line:#dce6dd;--amber:#fff0c2;--amberink:#825500;--red:#ffe0de;--redink:#a32b28;--blue:#e5f0ff;--shadow:0 8px 24px #183f2b12}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;padding:16px}.top{background:var(--green);color:white;padding:22px 18px 18px;border-radius:22px;box-shadow:var(--shadow)}.brandrow{display:flex;gap:12px;align-items:center}.logo{width:50px;height:50px;border-radius:16px;background:#ffffff20;display:grid;place-items:center;font-size:29px;flex-shrink:0}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;opacity:.8;font-weight:800}.top h1{margin:2px 0 0;font-size:clamp(22px,5vw,32px);line-height:1.15}.top p{margin:12px 0 0;color:#dceee4;font-size:14px}.sample{display:inline-flex;align-items:center;gap:6px;background:#fff1c9;color:#684600;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:800;margin-top:13px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.nav button{border:1px solid var(--line);background:white;color:var(--muted);padding:12px 6px;border-radius:13px;font-weight:800}.nav button.active{background:var(--green);color:white;border-color:var(--green)}.nav span{display:block;font-size:19px;margin-bottom:2px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.sectionhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.sectionhead h2{margin:0;font-size:22px}.sectionhead p{margin:4px 0 0;color:var(--muted);font-size:13px}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800;background:var(--mint);color:var(--green);white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{padding:12px;background:#f5f8f4;border-radius:14px}.stat strong{display:block;font-size:23px;line-height:1.2}.stat small{color:var(--muted);font-size:11px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.day{min-width:0;border:1px solid var(--line);border-radius:13px;padding:10px 7px;text-align:left;background:#fff;color:var(--ink)}.day.selected{outline:2px solid var(--green);background:var(--mint);border-color:var(--green)}.day .dow{font-size:11px;color:var(--muted);font-weight:800}.day .date{font-size:16px;font-weight:850;margin:4px 0}.day .count{font-size:11px;font-weight:750}.bar{height:5px;background:#e7eee8;border-radius:8px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--green2);border-radius:8px}.bar.full i{background:#c03932}.daylist{display:grid;gap:9px;margin-top:14px}.bookingrow{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:13px}.avatar{width:42px;height:42px;display:grid;place-items:center;background:#f0f5e8;border-radius:13px;font-size:23px;flex-shrink:0}.grow{flex:1;min-width:0}.grow strong{display:block}.sub{font-size:12px;color:var(--muted)}.status{font-size:11px;font-weight:800;padding:5px 7px;border-radius:8px}.ok{background:var(--mint);color:var(--green)}.warn{background:var(--amber);color:var(--amberink)}.bad{background:var(--red);color:var(--redink)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #cbd8ce;border-radius:10px;background:white;color:var(--ink)}.primary,.secondary{border:0;border-radius:11px;padding:12px 14px;font-weight:850}.primary{background:var(--green);color:white}.secondary{background:var(--mint);color:var(--green)}.fullbtn{width:100%;margin-top:12px}.hint{background:#f4f8f4;padding:11px 12px;border-radius:12px;color:var(--muted);font-size:12px;margin-top:12px}.message{padding:11px 12px;border-radius:11px;font-size:13px;margin-top:10px;display:none}.message.show{display:block}.dogcard{border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px}.dogtop{display:flex;gap:10px;align-items:center}.dogtop .grow{flex:1}.vaxline{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:9px 0 11px;padding:8px 10px;background:#f7f9f6;border-radius:10px;font-size:12px}.checkin{font-size:12px;font-weight:800;border:0;border-radius:9px;padding:8px 10px;background:var(--green);color:white}.checkin:disabled{background:#e6e8e6;color:#777;cursor:not-allowed}.noteslabel{font-size:12px;font-weight:850;margin:10px 0 7px}.notegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.note{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 3px;color:var(--ink);font-size:11px;font-weight:800;min-height:60px}.note .emoji{display:block;font-size:19px;margin-bottom:3px}.note.saved{background:var(--mint);border-color:#78ad8e;color:var(--green)}.note.saved::after{content:"✓";display:block;font-size:11px}.empty{padding:24px 12px;text-align:center;color:var(--muted);background:#f7f9f6;border-radius:13px}.ownerbox{background:#f5f8f4;border-radius:14px;padding:13px;margin-bottom:12px}.pupdate-list{display:grid;gap:9px}.pupdate-note{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px}.pupdate-note .emoji{font-size:24px}.pupdate-note time{margin-left:auto;color:var(--muted);font-size:11px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:8px 0 22px}.toast{position:fixed;left:16px;right:16px;bottom:16px;max-width:500px;margin:auto;background:#20332c;color:white;padding:13px 16px;border-radius:13px;box-shadow:var(--shadow);display:none;z-index:5}.toast.show{display:block}@media(min-width:700px){.shell{padding:24px}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;align-items:start}.layout>.panel{margin-bottom:14px}.doggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dogcard{margin:0}.top{padding:26px}.nav button{padding:14px}.week{gap:10px}.day{padding:12px}}@media(max-width:390px){.shell{padding:10px}.panel{padding:12px}.week{gap:4px}.day{padding:8px 4px}.day .dow{font-size:10px}.day .count{font-size:10px}.stats{gap:5px}.stat{padding:9px}.stat strong{font-size:20px}.formgrid{grid-template-columns:1fr}.notegrid{gap:4px}.note{font-size:10px}}
.bookingrow{flex-wrap:wrap}.bookingrow .grow{min-width:120px}.cancel-booking{background:#fff0ef;color:#8b2521;border:2px solid #a32b28;border-radius:10px;font-weight:800;min-height:44px;padding:9px 12px;cursor:pointer}.cancel-booking:hover,.cancel-booking:focus-visible{background:#a32b28;color:white}.cancel-booking:focus-visible{outline:3px solid #e5ad39;outline-offset:2px}@media(max-width:430px){.bookingrow .cancel-booking{width:100%}}</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brandrow"><div class="logo">🐾</div><div><div class="eyebrow">Staff workspace · Internal alpha</div><h1>Waggy Tails Dog Daycare</h1><div style="color:#dceee4;font-size:13px">Lucan, Co. Dublin</div></div></div>
    <p>One calm place for bookings, safe check-ins and little daily updates.</p>
    <div class="sample">● SAMPLE DATA — fictional dogs, owners & bookings</div>
  </header>
  <nav class="nav" aria-label="Main views">
    <button class="active" data-view="bookings"><span>📅</span>Bookings</button>
    <button data-view="today"><span>🐕</span>Today</button>
    <button data-view="pupdate"><span>💌</span>Pupdate</button>
  </nav>
  <main id="app"></main>
  <div class="footer">Internal alpha · Sample data only · Saved on this device in this browser</div>
</div>
<div id="toast" class="toast" role="status"></div>
<script>
(() => {
'use strict';
const KEY='waggyTailsAlpha_v1';
const DAY_MS=86400000;
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const shift=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmt=(iso,opts={weekday:'short',day:'numeric',month:'short'})=>new Date(iso+'T12:00:00').toLocaleDateString('en-IE',opts);
const plusDays=(n)=>shift(todayISO(),n);
const sampleDogs=[
{id:'d1',name:'Biscuit',breed:'Cockapoo',owner:'Aoife Murphy',email:'aoife@example.test',vax:plusDays(90),bookings:[plusDays(0),plusDays(1),plusDays(3)],notes:{}},
{id:'d2',name:'Luna',breed:'Labrador',owner:'Cian Byrne',email:'cian@example.test',vax:plusDays(8),bookings:[plusDays(0),plusDays(2)],notes:{}},
{id:'d3',name:'Milo',breed:'Terrier mix',owner:'Niamh Kelly',email:'niamh@example.test',vax:plusDays(-4),bookings:[plusDays(0),plusDays(4)],notes:{}},
{id:'d4',name:'Poppy',breed:'Cavapoo',owner:'Eoin Walsh',email:'eoin@example.test',vax:plusDays(12),bookings:[plusDays(1),plusDays(2),plusDays(4)],notes:{}},
{id:'d5',name:'Teddy',breed:'Golden Retriever',owner:'Sara Doyle',email:'sara@example.test',vax:plusDays(180),bookings:[plusDays(0),plusDays(5)],notes:{}},
{id:'d6',name:'Daisy',breed:'Beagle',owner:'Jack Nolan',email:'jack@example.test',vax:plusDays(2),bookings:[plusDays(2),plusDays(3)],notes:{}},
{id:'d7',name:'Ollie',breed:'Springer Spaniel',owner:'Maya Ryan',email:'maya@example.test',vax:plusDays(75),bookings:[plusDays(3),plusDays(4)],notes:{}},
{id:'d8',name:'Ruby',breed:'Shih Tzu',owner:'Finn O’Brien',email:'finn@example.test',vax:plusDays(0),bookings:[plusDays(0),plusDays(6)],notes:{}},
{id:'d9',name:'Archie',breed:'Mini Schnauzer',owner:'Leah Quinn',email:'leah@example.test',vax:plusDays(35),bookings:[plusDays(1),plusDays(5)],notes:{}},
{id:'d10',name:'Maple',breed:'Border Collie',owner:'Conor Hayes',email:'conor@example.test',vax:plusDays(120),bookings:[plusDays(2),plusDays(6)],notes:{}}
];
let state;
try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){state=null}
if(!state||!Array.isArray(state.dogs)) state={dogs:sampleDogs,capacity:40,view:'bookings',selectedDate:todayISO(),pupdateDog:'d1',checkedIn:[],notes:{},extraBookings:[]};
state.capacity=40;
state.dogs.forEach(d=>{d.notes=d.notes||{};d.bookings=d.bookings||[]});
let activeView=state.view||'bookings';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Could not save in this browser. Check storage settings.')}};
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}
function vaxStatus(d){const days=Math.ceil((new Date(d.vax+'T23:59:59')-new Date(todayISO()+'T00:00:00'))/DAY_MS);if(days<0)return{kind:'bad',text:`Expired ${Math.abs(days)}d ago`,days};if(days<=14)return{kind:'warn',text:days===0?'Expires today':`Expires in ${days}d`,days};return{kind:'ok',text:`In date · ${fmt(d.vax,{day:'numeric',month:'short',year:'numeric'})}`,days}}
function dogById(id){return state.dogs.find(d=>d.id===id)}
function bookingsOn(date){return state.dogs.filter(d=>d.bookings.includes(date))}
function room(date){return Math.max(0,state.capacity-bookingsOn(date).length)}
function nearestOpen(date){for(let i=1;i<=14;i++){const candidate=shift(date,i);if(room(candidate)>0)return candidate}return null}
function allWeekDates(){const base=state.selectedDate||todayISO();const d=new Date(base+'T12:00:00');const mondayOffset=(d.getDay()+6)%7;const mon=shift(base,-mondayOffset);return Array.from({length:7},(_,i)=>shift(mon,i))}
function render(){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===activeView));
 if(activeView==='bookings')renderBookings();else if(activeView==='today')renderToday();else renderPupdate();
}
function renderBookings(){
 const dates=allWeekDates(), chosen=state.selectedDate||todayISO(), count=bookingsOn(chosen).length;
 const nearest=nearestOpen(chosen);
 app.innerHTML=`<section class="panel"><div class="sectionhead"><div><h2>Bookings</h2><p>Choose a day, check capacity, then book safely.</p></div><span class="pill">40 places / day</span></div>
 <div class="stats"><div class="stat"><strong>${count}<span style="font-size:14px;color:var(--muted)"> / 40</span></strong><small>Booked on ${fmt(chosen,{weekday:'short',day:'numeric',month:'short'})}</small></div><div class="stat"><strong>${room(chosen)}</strong><small>Places left</small></div><div class="stat"><strong>${bookingsOn(todayISO()).length}</strong><small>Booked today</small></div></div>
 <div class="week">${dates.map(date=>{let n=bookingsOn(date).length;return `<button class="day ${date===chosen?'selected':''}" data-date="${date}" aria-pressed="${date===chosen}"><div class="dow">${fmt(date,{weekday:'short'})}</div><div class="date">${fmt(date,{day:'numeric',month:'short'})}</div><div class="count">${n>=40?'FULL':`${40-n} left`}</div><div class="bar ${n>=40?'full':''}"><i style="width:${Math.min(100,n/40*100)}%"></i></div></button>`}).join('')}</div>
 <div class="hint">Week of ${fmt(dates[0],{day:'numeric',month:'long'})}. Vaccination rules are checked at booking time; expired records cannot be booked.</div></section>
 <div class="layout"><section class="panel"><div class="sectionhead"><div><h2>Make a booking</h2><p>Only in-date vaccinations and days with room are allowed.</p></div></div>
 <form id="bookingForm"><div class="field"><label for="dogSelect">Dog</label><select id="dogSelect" required><option value="">Choose a dog…</option>${state.dogs.map(d=>`<option value="${d.id}">${esc(d.name)} — ${esc(d.owner)}</option>`).join('')}</select></div>
 <div class="field" style="margin-top:10px"><label for="bookDate">Booking date</label><input id="bookDate" type="date" value="${esc(chosen)}" required></div>
 <button class="primary fullbtn" type="submit">＋ Add booking</button><div id="bookingMessage" class="message"></div></form>
 <div class="hint">If the selected day is full, the app will suggest the nearest day with a free place. If a dog’s vaccination is expired, booking is blocked.</div></section>
 <section class="panel"><div class="sectionhead"><div><h2>Dogs booked</h2><p>${fmt(chosen,{weekday:'long',day:'numeric',month:'long'})}</p></div><span class="pill">${count} dogs</span></div>
 <div class="daylist">${bookingsOn(chosen).length?bookingsOn(chosen).map(d=>{const v=vaxStatus(d);return `<div class="bookingrow"><div class="avatar">🐶</div><div class="grow"><strong>${esc(d.name)}</strong><div class="sub">${esc(d.breed)} · ${esc(d.owner)}</div></div><span class="status ${v.kind}">${v.kind==='bad'?'Vax expired':v.kind==='warn'?'Due soon':'In date'}</span><button type="button" class="cancel-booking" data-cancel="${esc(d.id)}" aria-label="Cancel booking for ${esc(d.name)} on ${esc(chosen)}">Cancel booking</button></div>`}).join(''):'<div class="empty">No dogs booked yet for this day.</div>'}</div></section></div>`;
 app.querySelectorAll('[data-cancel]').forEach(button=>button.addEventListener('click',()=>{
   const d=dogById(button.dataset.cancel),date=state.selectedDate;
   if(!d||!d.bookings.includes(date))return;
   if(!window.confirm(`Cancel ${d.name}'s booking for ${fmt(date,{weekday:'long',day:'numeric',month:'long'})}?`))return;
   d.bookings=d.bookings.filter(booked=>booked!==date);
   state.checkedIn=state.checkedIn.filter(key=>key!==date+':'+d.id);
   save();render();toast(`${d.name}'s booking cancelled. One place is now available.`);
 }));
 app.querySelectorAll('[data-date]').forEach(b=>b.addEventListener('click',()=>{state.selectedDate=b.dataset.date;save();render()}));
 document.getElementById('bookDate').addEventListener('change',e=>{state.selectedDate=e.target.value||todayISO();save();render()});
 document.getElementById('bookingForm').addEventListener('submit',e=>{e.preventDefault();const id=document.getElementById('dogSelect').value,date=document.getElementById('bookDate').value,d=dogById(id),msg=document.getElementById('bookingMessage');const show=(text,kind)=>{msg.textContent=text;msg.className='message show';msg.style.background=kind==='bad'?'var(--red)':kind==='warn'?'var(--amber)':'var(--mint)';msg.style.color=kind==='bad'?'var(--redink)':kind==='warn'?'var(--amberink)':'var(--green)'};
 if(!d||!date){show('Choose a dog and date first.','bad');return}
 if(d.bookings.includes(date)){show(`${d.name} is already booked for this day.`,'warn');return}
 const v=vaxStatus(d);if(v.kind==='bad'){show(`Booking blocked: ${d.name}’s vaccination is expired (${fmt(d.vax,{day:'numeric',month:'short',year:'numeric'})}). Update the record after verifying paperwork.`,'bad');return}
 if(room(date)===0){const next=nearestOpen(date);show(next?`This day is full. Nearest day with room: ${fmt(next,{weekday:'long',day:'numeric',month:'short'})} (${room(next)} places left). Select it above to book.`:'No day with room found in the next 14 days.','warn');if(next){state.selectedDate=next;save();render();document.getElementById('bookDate').value=next}return}
 d.bookings.push(date);state.selectedDate=date;save();toast(`${d.name} booked for ${fmt(date,{weekday:'short',day:'numeric',month:'short'})}`);render();
 });
}
const noteTypes=[['ate','🍽️','Ate'],['walked','🦮','Walked'],['played','🎾','Played'],['napped','💤','Napped']];
function renderToday(){
 const date=todayISO(), dogs=bookingsOn(date);
 app.innerHTML=`<section class="panel"><div class="sectionhead"><div><h2>Today’s pack 🐾</h2><p>${fmt(date,{weekday:'long',day:'numeric',month:'long'})} · quick notes designed for busy hands</p></div><span class="pill">${dogs.length} booked</span></div>
 <div class="stats"><div class="stat"><strong>${dogs.length}</strong><small>Expected today</small></div><div class="stat"><strong>${state.checkedIn.filter(x=>x.startsWith(date+':')).length}</strong><small>Checked in</small></div><div class="stat"><strong>${dogs.filter(d=>vaxStatus(d).kind==='bad').length}</strong><small>Vax expired</small></div></div>
 <div class="hint"><strong>Safety rule:</strong> red = expired and check-in blocked. Amber = expires within 14 days. Tap a checklist item once to save that dog’s note for today.</div></section>
 <section class="panel"><div class="sectionhead"><div><h2>Dog checklist</h2><p>One tap per note · saved automatically</p></div><span class="pill">Sample data</span></div>
 ${dogs.length?`<div class="doggrid">${dogs.map(d=>{const v=vaxStatus(d),checked=state.checkedIn.includes(date+':'+d.id),notes=d.notes[date]||[];return `<article class="dogcard"><div class="dogtop"><div class="avatar">🐕</div><div class="grow"><strong>${esc(d.name)}</strong><div class="sub">${esc(d.breed)} · ${esc(d.owner)}</div></div><button class="checkin" data-checkin="${d.id}" ${v.kind==='bad'?'disabled':''}>${checked?'✓ Checked in':v.kind==='bad'?'Blocked':'Check in'}</button></div>
 <div class="vaxline"><span>💉 Kennel cough vaccination</span><span class="status ${v.kind}">${esc(v.text)}</span></div>
 ${v.kind==='bad'?'<div class="sub" style="color:var(--redink);font-weight:800;margin-bottom:8px">Do not check in — verify updated vaccination record first.</div>':''}
 <div class="noteslabel">Today’s notes — tap to add/remove</div><div class="notegrid">${noteTypes.map(([key,emoji,label])=>`<button class="note ${notes.includes(key)?'saved':''}" data-note="${key}" data-dog="${d.id}" aria-pressed="${notes.includes(key)}"><span class="emoji">${emoji}</span>${label}</button>`).join('')}</div>
 <div class="sub" style="margin-top:8px">${notes.length?`${notes.length} note${notes.length===1?'':'s'} saved for Pupdate`:'No notes added yet'}</div></article>`}).join('')}</div>`:'<div class="empty">No dogs are booked for today. Add a booking in the Bookings view.</div>'}
 </section>`;
 app.querySelectorAll('[data-checkin]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.checkin,d=dogById(id);if(vaxStatus(d).kind==='bad'){toast('Check-in blocked: vaccination expired.');return}const key=date+':'+id;if(state.checkedIn.includes(key)){state.checkedIn=state.checkedIn.filter(x=>x!==key);toast(`${d.name} marked not checked in`)}else{state.checkedIn.push(key);toast(`${d.name} checked in`)}save();render()}));
 app.querySelectorAll('[data-note]').forEach(b=>b.addEventListener('click',()=>{const d=dogById(b.dataset.dog),key=b.dataset.note;d.notes[date]=d.notes[date]||[];if(d.notes[date].includes(key))d.notes[date]=d.notes[date].filter(x=>x!==key);else d.notes[date].push(key);save();render();toast(`${d.name}: ${noteTypes.find(n=>n[0]===key)[2]} ${d.notes[date].includes(key)?'added':'removed'}`)}));
}
function renderPupdate(){
 const date=todayISO(), id=state.pupdateDog||state.dogs[0].id,d=dogById(id)||state.dogs[0],notes=d.notes[date]||[];
 app.innerHTML=`<section class="panel"><div class="sectionhead"><div><h2>Pupdate 💌</h2><p>A private owner view: one selected dog only.</p></div><span class="pill">Owner view</span></div>
 <div class="ownerbox"><div class="field"><label for="ownerDog">Preview as this dog’s owner</label><select id="ownerDog">${state.dogs.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${esc(x.name)} · ${esc(x.owner)}</option>`).join('')}</select></div><div class="sub" style="margin-top:8px">Demo mode: staff can switch the sample owner to preview privacy. In a live version, each owner would be authenticated and only see their own dog.</div></div>
 <div class="dogtop" style="padding:12px 0 16px"><div class="avatar" style="width:54px;height:54px;font-size:29px">🐶</div><div class="grow"><strong style="font-size:20px">${esc(d.name)}’s day</strong><div class="sub">${esc(d.owner)} · ${fmt(date,{weekday:'long',day:'numeric',month:'long'})}</div></div></div>
 <div class="pupdate-list">${notes.length?notes.map(key=>{const item=noteTypes.find(n=>n[0]===key);return `<div class="pupdate-note"><span class="emoji">${item[1]}</span><div class="grow"><strong>${item[2]}</strong><div class="sub">A little update from daycare</div></div><time>Today</time></div>`}).join(''):'<div class="empty"><div style="font-size:28px">🌿</div><strong>No updates just yet</strong><div class="sub" style="margin-top:5px">When the team adds a checklist note, it will appear here.</div></div>'}</div>
 <div class="hint">Privacy by design: this screen renders only <strong>${esc(d.name)}</strong> and notes linked to this dog. It does not show the other dogs, their owners, or their updates.</div></section>`;
 document.getElementById('ownerDog').addEventListener('change',e=>{state.pupdateDog=e.target.value;save();render()});
}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{activeView=b.dataset.view;state.view=activeView;save();render()}));
render();
})();
</script>
</body>
</html>
